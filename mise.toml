[tools]
node = "26"
pnpm = "11"

[tasks.dev]
run = "hugo server"
alias = "start"

[tasks."dev:drafts"]
run = "hugo server --buildDrafts"

[tasks."cf:login"]
run = "pnpx wrangler login"

[tasks.clean]
run = "rm -rf public"

[tasks.build]
depends = ["clean"]
run = "hugo"

[tasks.deploy]
depends = ["build"]
run = "pnpx wrangler pages deploy public --project-name blog --branch main"
